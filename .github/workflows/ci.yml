# Checks that need no secret, no server, no real API and no deployment. Nothing here writes to the repository:
# the token is read-only and no job creates a commit.
# Every test command was run by hand from a fresh checkout on 07.10.2026 (Windows, Python 3.12; Linux, Python 3.14).
# Actions are pinned to full commit SHAs (the repository refuses unpinned ones).
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  COMMIT_NAME: "MenQ"
  COMMIT_EMAIL: "300099401+menqstudio@users.noreply.github.com"
jobs:
  commit-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Author and committer of every new commit
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then range="$BASE..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"
          else range="$GITHUB_SHA"; fi
          echo "range: $range"
          python3 tools/check_commit_identity.py "$range" "$COMMIT_NAME" "$COMMIT_EMAIL"
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: API reader (collector, queue side, installer)
        working-directory: runtime/api_reader
        run: |
          python -m unittest test_bro_api_reader
          python -m unittest test_ops_api
      - name: Server code as installed (its own suites)
        working-directory: runtime/server
        # GOOGLE_SHEET.json in that folder is a test fixture, not the server's file
        run: python -m unittest discover -p "test_*.py"
      - name: Order flow (internal backend, not deployed) against the server code
        env:
          PYTHONPATH: runtime/server
        run: python -m unittest discover -s runtime/order_flow -p "test_*.py"
      - name: Request flow (internal backend, not deployed) on top of the order flow
        env:
          PYTHONPATH: "runtime/server:runtime/order_flow"
        run: python -m unittest discover -s runtime/request_flow -p "test_*.py"
      - name: Armen portal (separate login, photos, daily answers; not deployed), with its one pinned dependency
        working-directory: runtime/armen_portal
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s . -p "test_*.py"
      - name: Armen portal, the page scripts parse
        run: |
          node --check runtime/armen_portal/app.js
          node --check runtime/armen_portal/login.js
      - name: Package manifest matches the files
        working-directory: runtime/api_reader
        run: sha256sum -c SHA256SUMS.txt
      - name: Site, static references
        run: python tools/check_site_assets.py
      - name: Design system (generated files, pinned component copy, token coverage, contrast, brand separation)
        run: python design/scripts/validate_design.py
      - name: Action approval (internal contract, no executor) against the server code
        env:
          PYTHONPATH: runtime/server
        run: python -m unittest discover -s runtime/action_approval -p "test_*.py"
      - name: Action executor, simulation only (no external action) on top of the approval contract
        env:
          PYTHONPATH: "runtime/server:runtime/action_approval"
        run: python -m unittest discover -s runtime/action_executor -p "test_*.py"
      - name: Business service (internal facade over the four modules; no HTTP, no authentication)
        env:
          PYTHONPATH: "runtime/server:runtime/order_flow:runtime/request_flow:runtime/action_approval:runtime/action_executor"
        run: python -m unittest discover -s runtime/business_service -p "test_*.py"
      - name: README visuals hold nothing GitHub would block or that loads from outside
        run: |
          ! grep -l -E "<script|foreignObject|@font-face|<image|href=|url\(http" docs/assets/readme/*.svg
          test "$(ls docs/assets/readme/*.svg | wc -l)" = 36
      - name: README diagrams are what README.md says today
        run: python tools/make_repo_visuals.py --check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: API reader
        working-directory: runtime/api_reader
        run: |
          python -m unittest test_bro_api_reader
          python -m unittest test_ops_api
      - name: Order flow (internal backend, not deployed) against the server code
        env:
          PYTHONPATH: runtime/server
        run: python -m unittest discover -s runtime/order_flow -p "test_*.py"
      - name: Request flow (internal backend, not deployed) on top of the order flow
        env:
          PYTHONPATH: "runtime/server;runtime/order_flow"
        run: python -m unittest discover -s runtime/request_flow -p "test_*.py"
      - name: Armen portal (separate login, photos, daily answers; not deployed), with its one pinned dependency
        working-directory: runtime/armen_portal
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s . -p "test_*.py"
      - name: Server code, the runtime suite the order flow builds on
        working-directory: runtime/server
        run: python -m unittest test_runtime
      - name: WIP, gate hook and Windows job object
        working-directory: runtime/wip/adapter_preflight
        run: |
          python -m unittest test_bro_gate_hook
          python -m unittest test_win_job
      - name: Action approval (internal contract, no executor) against the server code
        env:
          PYTHONPATH: runtime/server
        run: python -m unittest discover -s runtime/action_approval -p "test_*.py"
      - name: Action executor, simulation only (no external action) on top of the approval contract
        env:
          PYTHONPATH: "runtime/server;runtime/action_approval"
        run: python -m unittest discover -s runtime/action_executor -p "test_*.py"
      - name: Business service (internal facade over the four modules; no HTTP, no authentication)
        env:
          PYTHONPATH: "runtime/server;runtime/order_flow;runtime/request_flow;runtime/action_approval;runtime/action_executor"
        run: python -m unittest discover -s runtime/business_service -p "test_*.py"
      - name: Design system (same check as on Linux; Windows encoding and line endings)
        run: python design/scripts/validate_design.py
      - name: WIP, Chrome proxy (stand-in upstream, no browser)
        working-directory: runtime/wip/chrome_proxy
        run: python -m unittest test_bro_chrome_proxy
      - name: WIP, trial harness self-test (stand-in for the model, no model run)
        working-directory: runtime/wip/trial
        run: python -m unittest test_trial_harness
      - name: WIP, the three tests that used to fail here, five more times (the race they exposed is fixed)
        working-directory: runtime/wip/trial
        shell: bash
        run: |
          for n in 1 2 3 4 5; do
            python -m unittest test_trial_harness.Honest.test_deny_cases test_trial_harness.Order.test_tab_id_mismatch_stops_the_queue test_trial_harness.Order.test_tab_id_unknown_form_stays_informational_and_matching_id_passes
          done

<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>КРЮК24 — тестовый журнал</title>
<style>body{margin:0;background:#f3f5f8;color:#14243c;font:16px system-ui}main{max-width:980px;margin:auto;padding:24px}article{background:white;border:1px solid #d6dfeb;border-radius:14px;padding:20px;margin:16px 0;overflow-wrap:anywhere}button,a{display:inline-block;padding:12px;margin:4px;border-radius:8px}button{background:#ff6900;border:0;font:inherit;cursor:pointer}button:disabled{opacity:.5}dt{font-weight:bold}dd{margin:0 0 12px}small{display:block}pre{white-space:pre-wrap}#notice{border-left:4px solid #ff6900;padding:12px;background:white}</style>
<main><h1>Тестовый журнал заявок</h1><p id="notice">Реальная отправка отключена. Кнопки ниже — локальная проверка решения диспетчера, не ответ Армена и не заказ машины.</p><a href="/">К форме</a><a href="/operator/work">Աշխատանքների հերթ</a><button id="refresh">Обновить</button><p id="status" role="status"></p><details><summary>Записать тестовый звонок (отдельно от сайта)</summary><form id="call-form"><label>Дата <input name="date" type="date" required></label><label>Результат <select name="outcome"><option>INQUIRY</option><option>ACCEPTED</option><option>COMPLETED</option><option>DECLINED</option><option>UNKNOWN</option></select></label><label>Сумма, если известна <input name="amount" type="number" min="1"></label><label>Источник сведений <input name="evidence" required maxlength="1000"></label><button>Сохранить тестовый звонок</button></form></details><section id="contacts"></section><section id="calls"></section><section id="orders"></section></main>
<script>
const vehicleNames={car:'Автомобиль',moto:'Мотоцикл',commercial:'Коммерческий транспорт',special:'Спецтехника'};
const text=(tag,value)=>{const e=document.createElement(tag);e.textContent=value;return e;};
async function load(){
 const r=await fetch('/test-report');if(!r.ok)throw Error('Журнал недоступен');const d=await r.json(),box=document.getElementById('orders');box.replaceChildren();
 const contacts=document.getElementById('contacts');contacts.replaceChildren(text('h2','Нажатия кнопок связи — не звонки и не сообщения'));
 const channelLabels={call:'Нажал «Позвонить»',wa:'Нажал WhatsApp',tg:'Нажал Telegram'};
 for(const [label,rows] of [['Реальные записи (TEST исключён)',d.contact_daily||[]],['Только TEST',d.contact_daily_test||[]]]){
  contacts.append(text('h3',label+' — дни по Москве'));if(!rows.length)contacts.append(text('p','Записанных нажатий нет. Это не доказательство отсутствия обращений.'));
  for(const day of rows)contacts.append(text('p',day.date+' / Позвонить: '+day.call+' / WhatsApp: '+day.wa+' / Telegram: '+day.tg));
 }
 for(const row of d.contact_interactions||[]){const m=row.data;contacts.append(text('p',new Date(row.created).toLocaleString('ru-RU',{timeZone:'Europe/Moscow'})+' / '+channelLabels[m.channel]+' / '+m.page+' / '+m.position+' / '+(m.referrer_domain||'Источник неизвестен/прямой')+' / '+JSON.stringify(m.utm||{})+(m.yclid?' / yclid: '+m.yclid:'')+' / '+m.device+' / '+(m.test?'TEST':'')+(row.order_id?' / Связано с заявкой '+row.order_id:'')));}
 const calls=document.getElementById('calls');calls.replaceChildren(text('h2','Звонки — отдельно от сайта'));for(const call of d.call_jobs||[])calls.append(text('p',call.data.date+' / '+call.data.outcome+' / '+(call.data.amount??'Сумма неизвестна')+' / OPERATOR_REPORTED'));
 if(!d.orders.length)box.append(text('p','Пока нет заявок.'));
 for(const order of d.orders){const a=document.createElement('article'),n=d.notifications.find(x=>x.order_id===order.id),decision=d.dispatch_decisions.find(x=>x.order_id===order.id);
 a.append(text('h2','Заявка '+order.id.slice(0,8)),text('small','Полный ID: '+order.id));const dl=document.createElement('dl');
 for(const [label,value] of [['Контакт',order.data.contact],['Откуда',order.data.pickup],['Куда',order.data.destination],['Транспорт',vehicleNames[order.data.vehicle]||order.data.vehicle],['Предварительный расчет',order.data.estimate_display||'Не указан'],['Статус заявки',order.status],['WhatsApp / Telegram',d.whatsapp_matches?.some(m=>m.order_id===order.id)?'Сообщение замечено оператором по ID':'Получение НЕ подтверждено'],['Уведомление',n?n.status:order.data.flow==='VISITOR_SENDS_WHATSAPP'?'Отправляет сам клиент':'Не поставлено в очередь (старая запись)'],['Решение диспетчера',decision?decision.decision+' / '+decision.trust_level:'Не записано']])dl.append(text('dt',label),text('dd',value));
 a.append(dl);
 if(order.data.test===true&&!d.whatsapp_matches?.some(m=>m.order_id===order.id)){
 const f=document.createElement('form');const ref=document.createElement('input'),proof=document.createElement('input');ref.placeholder='Ссылка/идентификатор сообщения';proof.placeholder='Скопированный ID из тестового сообщения';ref.required=proof.required=true;const save=text('button','Тест: записать совпадение по ID');f.append(ref,proof,save);
 f.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{const r=await fetch('/test-match',{method:'POST',headers:{'Content-Type':'application/json','X-Test-Nonce':window.KRYUK_TEST_NONCE},body:JSON.stringify({order_id:order.id,external_ref:ref.value,evidence:proof.value})});const result=await r.json();if(!r.ok)throw Error(result.error);await load();}catch(e){document.getElementById('status').textContent=e.message;save.disabled=false;}};a.append(f);
 }

 if(order.data.test===true&&!decision){for(const [label,value] of [['Тест: принять','ACCEPTED'],['Тест: отклонить','DECLINED']]){const b=text('button',label);b.type='button';b.onclick=async()=>{b.disabled=true;try{const r=await fetch('/test-dispatch-decision',{method:'POST',headers:{'Content-Type':'application/json','X-Test-Nonce':window.KRYUK_TEST_NONCE},body:JSON.stringify({order_id:order.id,decision:value})});const result=await r.json();if(!r.ok)throw Error(result.error);document.getElementById('status').textContent='Тестовое решение записано. Армен не уведомлен.';await load();}catch(e){document.getElementById('status').textContent=e.message;b.disabled=false;}};a.append(b);}}
 box.append(a);}
}
let callPending=null;
document.getElementById('call-form').onsubmit=async e=>{e.preventDefault();const f=e.target,data=Object.fromEntries(new FormData(f));data.amount=data.amount?Number(data.amount):null;const raw=JSON.stringify(data);if(!callPending||callPending.raw!==raw)callPending={raw,key:crypto.randomUUID()};const b=f.querySelector('button');b.disabled=true;try{const r=await fetch('/test-call',{method:'POST',headers:{'Content-Type':'application/json','X-Test-Nonce':window.KRYUK_TEST_NONCE,'Idempotency-Key':callPending.key},body:raw});const result=await r.json();if(!r.ok)throw Error(result.error);document.getElementById('status').textContent='Тестовый звонок записан отдельно от сайта.';await load();}catch(e){document.getElementById('status').textContent=e.message;}finally{b.disabled=false;}};
document.getElementById('refresh').onclick=()=>load().catch(e=>document.getElementById('status').textContent=e.message);load().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>

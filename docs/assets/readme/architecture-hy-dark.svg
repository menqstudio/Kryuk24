<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 736" width="640" height="736" role="img" aria-label="KRYUK24-ի ճարտարապետությունը. GitHub-ում կոդն ու փաստաթղթերն են. VPS-ում runtime-ն ա՝ հերթը, վահանակը, Bro-ի կամուրջն ու API reader-ը դրված են, փոստը, հաստատումները, executor-ն ու monitoring-ը պլանավորված են. Debian-ի worker-ը պլանավորված ա. Windows-ը մշակման ու հսկվող փորձերի համար ա"><title>KRYUK24-ի ճարտարապետությունը. GitHub-ում կոդն ու փաստաթղթերն են. VPS-ում runtime-ն ա՝ հերթը, վահանակը, Bro-ի կամուրջն ու API reader-ը դրված են, փոստը, հաստատումները, executor-ն ու monitoring-ը պլանավորված են. Debian-ի worker-ը պլանավորված ա. Windows-ը մշակման ու հսկվող փորձերի համար ա</title><rect x="0.5" y="0.5" width="639.0" height="735.0" rx="24" fill="#13233A" stroke="#34475F" stroke-width="1"/><text x="32.0" y="50.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">Որտեղ ինչն ա ապրում</text><text x="32.0" y="74.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#9FB0C5" text-anchor="start">Նպատակային տեղաբաշխումը ու ինչ կա այսօր</text><rect x="32" y="88" width="576" height="1" fill="#34475F"/><rect x="32.0" y="108.0" width="576.0" height="98.0" rx="16" fill="#1B2F4C" stroke="#34475F" stroke-width="1"/><rect x="32" y="124" width="4" height="28" fill="#EF5B00"/><text x="52.0" y="138.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">GitHub</text><text x="52.0" y="158.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Հիմնական կոդը, փաստաթղթերը, որոշումները, քարտեզը</text><rect x="52" y="167" width="536" height="1" fill="#34475F"/><text x="52.0" y="189.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Փակ repo, CI ամեն փոփոխության վրա</text><rect x="542.8" y="172.0" width="49.2" height="24.0" rx="12" fill="#17382F"/><circle cx="555.8" cy="184.0" r="3.5" fill="#4ADE80"/><text x="565.8" y="188.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4ADE80" text-anchor="start" letter-spacing="0.50">ԿԱ</text><rect x="32.0" y="218.0" width="576.0" height="200.0" rx="16" fill="#1B2F4C" stroke="#34475F" stroke-width="1"/><rect x="32" y="234" width="4" height="28" fill="#EF5B00"/><text x="52.0" y="248.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">VPS</text><text x="52.0" y="268.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Runtime-ը։ STAGING, ուղարկելը անջատված ա</text><rect x="52" y="277" width="536" height="1" fill="#34475F"/><text x="52.0" y="299.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Օրվա հերթ, վահանակ, Bro-ի կամուրջ</text><rect x="497.1" y="282.0" width="94.9" height="24.0" rx="12" fill="#17382F"/><circle cx="510.1" cy="294.0" r="3.5" fill="#4ADE80"/><text x="520.1" y="298.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#4ADE80" text-anchor="s
ial,sans-serif" font-size="11" font-weight="700" fill="#C9D3E0" text-anchor="start" letter-spacing="0.50">ՊԼԱՆՈՒՄ Ա</text><rect x="32.0" y="430.0" width="576.0" height="98.0" rx="16" fill="#1B2F4C" stroke="#34475F" stroke-width="1"/><rect x="32" y="446" width="4" height="28" fill="#EF5B00"/><text x="52.0" y="460.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Debian desktop</text><text x="52.0" y="480.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Browser ու media worker</text><rect x="52" y="489" width="536" height="1" fill="#34475F"/><text x="52.0" y="511.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Սահմանափակ worker, որ վերցնում ա runtime-ի գործերը</text><rect x="477.9" y="494.0" width="114.1" height="24.0" rx="12" fill="#263A56"/><circle cx="490.9" cy="506.0" r="3.5" fill="#C9D3E0"/><text x="500.9" y="510.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#C9D3E0" text-anchor="start" letter-spacing="0.50">ՊԼԱՆՈՒՄ Ա</text><rect x="32.0" y="540.0" width="576.0" height="98.0" rx="16" fill="#1B2F4C" stroke="#34475F" stroke-width="1"/><rect x="32" y="556" width="4" height="28" fill="#EF5B00"/><text x="52.0" y="570.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">Windows</text><text x="52.0" y="590.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Միայն մշակում ու հսկվող փորձեր</text><rect x="52" y="599" width="536" height="1" fill="#34475F"/><text x="52.0" y="621.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" text-anchor="start">Chrome proxy, gate, trial harness</text><rect x="458.7" y="604.0" width="133.3" height="24.0" rx="12" fill="#3A3320"/><circle cx="471.7" cy="616.0" r="3.5" fill="#FBBF24"/><text x="481.7" y="620.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#FBBF24" text-anchor="start" letter-spacing="0.50">ԸՆԹԱՑՔՈՒՄ Ա</text><text x="32.0" y="666.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Runtime-ից դուրս. կենդանի կայքը՝ kryuk24.ru, դեռ կապված չի runtime-ին։</text><text x="32.0" y="686.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#C9D3E0" text-anchor="start">Հրապարակային կամ վճարովի ամեն քայլ՝ Գևի հաստատումով հենց էդ քայլի համար։</text><text x="32.0" y="712.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans','Noto Sans Armenian',Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#9FB0C5" text-anchor="start">Վիճակը 07.10.2026-ին։ Աղբյուր՝ docs/CURRENT_STATE.md</text></svg>
